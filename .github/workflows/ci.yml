name: CI

# Lint, types, formatting, unit tests and the end-to-end suite, which builds the site
# against the mock API. Vercel deploys on its own; this is the check for pull requests
# and the status of master.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The Makefile runs both apps on Node 20.
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn format:check
      - run: yarn test

      - run: npx playwright install --with-deps chromium
      - run: yarn test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
