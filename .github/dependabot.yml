version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "eslint-config-next"]
      # React 19 refuses to run with different react and react-dom versions.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      testing:
        patterns:
          - "vitest"
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-svgr"
          - "jsdom"
          - "@testing-library/*"
          - "@playwright/test"
          - "axe-core"
    ignore:
      # Held at versions that support Node 20, which the Makefile runs both apps on.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      # Bulma 1 rewrites the styles the site is built on.
      - dependency-name: bulma
        update-types: ["version-update:semver-major"]
      # Next.js 16 is a migration of its own (eslint-config-next's new config format,
      # Turbopack builds with the SVG loader), planned separately.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
